name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: bash ci.sh

  publish:
    concurrency:
      cancel-in-progress: false
      group: publish
    if: github.event_name == 'push'
    needs: gate
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bash publish.sh
